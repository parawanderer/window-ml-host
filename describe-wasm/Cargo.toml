[package]
name = "describe-wasm"
version = "0.10.0"
description = "window.ml's describer (wmlhost-describe) behind a raw wasm ABI, for the extension's service worker"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/parawanderer/window-ml-host"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wmlhost-describe = { path = "../describe" }
serde_json = "1.0.154"
