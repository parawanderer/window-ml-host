name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch; a push supersedes the run before it. main keeps every run as a record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the version; this installs exactly that, with rustfmt and clippy.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Ubuntu 24.04 restricts unprivileged user namespaces for every program and lets a program opt back in through
      # its own AppArmor profile, the way it ships Chrome's and Flatpak's. This grants that to bwrap alone, on a runner
      # that is thrown away; the restriction stays on for everything else.
      - name: Let bubblewrap create user namespaces
        if: runner.os == 'Linux'
        run: |
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --ro-bind / / --unshare-net --unshare-pid --dev /dev --proc /proc /bin/true
          echo "bubblewrap starts: the Linux sandbox tests enforce"
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
        # On Linux the sandbox must start: a test that finds it unavailable fails instead of taking the fail-closed path.
        env:
          WMLHOST_REQUIRE_SANDBOX: ${{ runner.os == 'Linux' && '1' || '' }}
      - name: Node client
        run: |
          node --test clients/node/*.test.mjs
          node clients/node/smoke.mjs target/debug/wmlhost
      - name: Docs
        run: cargo doc --no-deps --locked

  # The default build compiles no crate from the hub (tools/check-no-hub.sh).
  no-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: The default build has no wmlhub crate
        run: tools/check-no-hub.sh

  hub-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The end-to-end tests run a program over the hub, which runs only sandboxed: the same bubblewrap as `rust`.
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Let bubblewrap create user namespaces
        run: |
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --ro-bind / / --unshare-net --unshare-pid --dev /dev --proc /proc /bin/true
      - name: Check with the hub feature
        run: cargo check --locked --features hub --all-targets
      - name: Clippy, hub feature and its end-to-end tests
        run: cargo clippy --locked --features hub --all-targets -p window-ml-host -p wmlhost-hub-tests -- -D warnings
      - name: Hub unit tests
        run: "cargo test --locked --features hub --lib hub::"
      - name: Hub end-to-end tests (an in-process hub)
        run: cargo test --locked -p wmlhost-hub-tests
        env:
          WMLHOST_REQUIRE_SANDBOX: "1"
