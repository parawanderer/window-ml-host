[package]
name = "wmlhost-describe"
version = "0.10.0"
description = "window.ml's describer: what an argv does, read from a program manifest, with no I/O (the process host and the extension's wasm both build it)"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/parawanderer/window-ml-host"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
