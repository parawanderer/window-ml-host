[package]
name = "window-ml-host"
version = "0.4.0"
description = "window.ml's process host: runs argv for the extension over native messaging, under the OS sandbox"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/parawanderer/window-ml-host"
publish = false

[[bin]]
name = "wmlhost"
path = "src/main.rs"

[features]
default = ["native"]
# Native messaging over stdio: the whole product on its own.
native = []
# The hub transport (later): pulls the hub's client crates in. OFF by default, and the default build must not compile
# any of them (tools/check-no-hub.sh, in CI).
hub = ["dep:wmlhub-client", "dep:wmlhub-seal", "dep:wmlhub-keys"]

[dependencies]
wmlhub-client = { git = "https://github.com/parawanderer/window-ml-hub", tag = "v0.4.3", optional = true }
wmlhub-seal = { git = "https://github.com/parawanderer/window-ml-hub", tag = "v0.4.3", optional = true }
wmlhub-keys = { git = "https://github.com/parawanderer/window-ml-hub", tag = "v0.4.3", optional = true }
tokio = { version = "1.53.3", features = ["fs", "io-util", "io-std", "macros", "process", "rt", "rt-multi-thread", "sync", "time", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"
sha2 = "0.11.0"
hex = "0.4.3"
getrandom = "0.4.3"
rustix = { version = "1.1.5", features = ["fs", "process"] }
clap = { version = "4.6.7", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
